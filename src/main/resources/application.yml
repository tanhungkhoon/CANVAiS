server:
  port: 8080

spring:
  application:
    name: canvais
  datasource:
    url: jdbc:h2:mem:canvaisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

canvais:
  spatial:
    default-crs: "EPSG:4326"
    default-center-lat: 48.1800
    default-center-lng: 8.2000
    default-zoom: 12
  vibe:
    confidence-threshold: 0.70
  mcp:
    request-timeout-seconds: 15
